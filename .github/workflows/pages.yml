name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Copy templates (excluded from Jekyll processing)
        run: |
          mkdir -p _site/templates
          cp -r templates/. _site/templates/

      - name: Copy only released lab R Markdown files
        run: ruby scripts/copy_released_rmd.rb

      - name: Verify released/withheld rmd files match _data/labs.yml
        run: |
          ruby -ryaml -e '
            labs = YAML.load_file("_data/labs.yml")["labs"]
            bad = labs.select do |lab|
              path = File.join("_site", lab["rmd_file"])
              lab["downloadable"] ? !File.exist?(path) : File.exist?(path)
            end
            unless bad.empty?
              bad.each { |l| puts "::error::#{l["rmd_file"]} (downloadable=#{l["downloadable"]}) is wrong in _site/" }
              exit 1
            end
            released = labs.count { |l| l["downloadable"] }
            puts "OK: #{released} released, #{labs.size - released} correctly withheld."
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
