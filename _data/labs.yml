# ---------------------------------------------------------------------------
# Structured lab schedule for BIOL/OCSC 4605 · 7220.
# Single source of truth: schedule.md and every labs/labNN.md page render
# from this file via Liquid, so edit dates/content here rather than in the
# generated pages directly.
#
# 11-lab Fall 2026 schedule (revised from the original 13-lab set):
# Labs 7 (Multifactor ANOVA), 8 (ANCOVA), and 11/Schneider's-numbering
# (Bootstrap Estimates) were cut to fit a 10-session term. Their core
# skills are still exercised elsewhere: multifactor/blocked-design GLM
# specification is practiced in Lab 9a/9b's own datasets, and
# resampling-based inference is already covered by Lab 4. `lab_label`
# keeps each surviving lab's original Schneider numbering (Lab 1, 2, 3, 4,
# 5a, 5b, 6a/b, 9a, 9b, 10) for traceability back to
# https://davidcschneider.github.io/StatisticalScience/; `week` is this
# course's own 1-11 session sequence, which is NOT the same as the
# original lab number for 9a/9b/10 (see syllabus.md for the Part-to-week
# mapping, which was rewritten to match).
#
# Week 11 ("Lab 11 (new)") is ORIGINAL content, not from Schneider's site
# at all -- none of his 13 labs cover AIC/model selection. It was added to
# align with Dr. Hurford's lecture schedule ("Model selection I" Nov 30,
# "Multimodel inference -- AIC and SIC" Dec 2), landing the lab exactly
# between those two lectures. It fills Part 6's slot, which otherwise has
# no lab in this 10-core-lab schedule (see syllabus.md).
#
# `module` field wording is checked against the Part titles on David C.
# Schneider's course site (https://davidcschneider.github.io/StatisticalScience/):
# Part 1 Quantitative Background, Part 2 Quantifying Uncertainty, Part 3 The
# General Linear Model - Single Explanatory Variable, Part 4 The General
# Linear Model - Multiple Explanatory Variables, Part 5 The Generalized
# Linear Model, Part 6 Extensions of the General Linear Model. Weeks 8-9
# ("Parts 3-5: Applied Integration") are this course's own synthesis lab, not
# a literal part title from that site. Parts 4 and 6 have no dedicated lab
# in this 10-lab schedule (see the note above).
#
# Fields:
#   week          - integer, 1-11
#   week_padded   - zero-padded string version of week ("01".."11"), used for
#                   building /labs/NN/ URLs in Liquid
#   date          - exact date of the lab (Fall 2026 Tuesdays)
#   lab_label     - the "Lab N" designation used in the syllabus (labs 5 and
#                   9 are split across two weeks as 5a/5b and 9a/9b)
#   title         - short lab title (without the "Lab N:" prefix)
#   slug          - kebab-case identifier, used for filenames
#   module        - lecture/part mapping
#   focus         - primary focus & learning objectives
#   deliverable   - key deliverable(s)
#   software      - key software / functions used
#   rmd_file      - path to the downloadable R Markdown starter, relative to
#                   the repo root
#   note          - optional logistical note (room, time, format, etc.)
#   downloadable  - true/false. Controls whether this week's Download button
#                   appears on its lab page AND whether the .Rmd file is
#                   published into _site/ at all during the GitHub Actions
#                   build (scripts/copy_released_rmd.rb only copies files
#                   for labs marked true, so an unreleased lab's file is
#                   genuinely absent from the live site, not just unlinked).
#                   Flip to true and push a few hours before that week's
#                   session; no need to re-run generate_labs.py just for
#                   this -- the lab page checks this flag at Jekyll build
#                   time via Liquid.
# ---------------------------------------------------------------------------
labs:
  - week: 1
    week_padded: "01"
    date: "Sept 15, 2026"
    lab_label: "Lab 1"
    title: "Inferential Cards"
    slug: "inferential-cards"
    module: "Part 1: Quantitative Background"
    focus: "Hands-on sampling & statistical inference. Understanding variability, hypothesis testing, and standard errors using physical playing cards."
    deliverable: "Manual data collection worksheet"
